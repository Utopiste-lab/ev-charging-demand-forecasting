target:
  name: Hourly Recorded Session-Start Counts
  definition: Count source sessions by the session-start time recorded in the archive filename.
  interval: "[timestamp, timestamp + 1 hour)"
  unit: recorded sessions per hour
  source_record: One archived CSV represents one source session with multiple telemetry rows.
clock:
  basis: source_clock
  timezone_status: unknown
  conversion: none
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  step_hours: 1
coverage:
